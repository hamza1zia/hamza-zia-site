<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | Hamza Zia</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #647084;
      --accent: #f97316;
      --accent-soft: #fff1e8;
      --border: #e3e8f0;
      --shadow: 0 24px 60px rgba(23, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.16), transparent 32%),
        linear-gradient(135deg, #f7f9fc 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .page {
      width: min(960px, 100%);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 0.82rem;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.3);
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: clamp(36px, 7vw, 72px);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -60px;
      top: -70px;
      background: var(--accent-soft);
      border-radius: 48px;
      transform: rotate(8deg);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      margin-bottom: 24px;
    }

    h1 span {
      color: var(--accent);
      display: block;
    }

    p {
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.75;
      max-width: 650px;
      margin-bottom: 34px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 12px;
      font-weight: 900;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .button.primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 16px 34px rgba(249, 115, 22, 0.28);
    }

    .button.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button.secondary:hover {
      border-color: rgba(249, 115, 22, 0.45);
      color: var(--accent);
    }

    .footer-note {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      body {
        padding: 22px;
        align-items: flex-start;
      }

      .nav {
        margin: 10px 0 24px;
      }

      .back-link {
        display: none;
      }

      .card {
        border-radius: 22px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="Page navigation">
      <a class="brand" href="../" aria-label="Return to Hamza Zia homepage">
        <span class="logo">HZ</span>
        <span>Hamza Zia</span>
      </a>
      <a class="back-link" href="../">Back to Home</a>
    </nav>

    <section class="card">
      <div class="content">
        <!-- <div class="eyebrow">Portfolio Project</div> -->
        <h1>Coming <span>Soon.</span></h1>
        <p>
          This project page is currently being refined. I am adding a clearer project walkthrough,
          technical details, key outcomes, and visuals to better showcase the work behind this portfolio item.
        </p>
        <div class="actions">
          <a class="button primary" href="../">Return Home</a>
          <a class="button secondary" href="mailto:contact@hamza-zia.com">Contact Me</a>
        </div>
        <div class="footer-note">More details will be available soon.</div>
      </div>
    </section>
  </main>
</body>
</html>
